name: Barrido de links

on:
  workflow_dispatch:
    inputs:
      site:
        description: "ID del sitio en sites.yaml (ej. tnf-pe), varios separados por coma, o all"
        required: true
        default: tnf-pe
  # Para correrlo solo todos los días durante el evento, quita los # de las dos líneas siguientes.
  # schedule:
  #   - cron: "0 11 * * *"   # 08:00 hora de Chile (verano)

permissions:
  contents: write

concurrency:
  group: link-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Barrer sitios
        env:
          SITE: ${{ inputs.site || 'all' }}
        run: python audit.py --site "$SITE"

      - name: Guardar reportes en el repo
        env:
          SITE: ${{ inputs.site || 'all' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add reports docs
          if git diff --cached --quiet; then
            echo "Sin cambios en los reportes"
          else
            git commit -m "Barrido de links: $SITE"
            git pull --rebase
            git push
          fi

      - name: Subir reporte descargable
        uses: actions/upload-artifact@v4
        with:
          name: reporte-links
          path: |
            reports/
            docs/
